name: bilin
description: "Brazilian tutoring platform connecting students with language teachers"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  # State management and navigation
  provider: ^6.1.1
  go_router: ^14.0.2
  # Firebase integration
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  # UI and utilities
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  # Form validation and input formatting
  mask_text_input_formatter: ^2.9.0
  # Location services
  geolocator: ^10.1.0
  # Http requests
  http: ^1.2.0
  # Local storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
