<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Story semana grátis</title>
<style>
/*@fonts*/
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--char);color:var(--white);font-family:"Poligrapher",sans-serif;position:relative}
.page{position:absolute;inset:0;padding:230px 88px 250px;display:flex;flex-direction:column}
.pills{display:flex;gap:14px}
.pill{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:16px 28px;font-weight:700;font-size:34px;line-height:1}
.pill img{height:36px}
.pill.white{background:var(--white);color:var(--char)}
.pill.coral{background:var(--coral);color:var(--char)}
h1{font-weight:800;font-size:196px;line-height:.9;letter-spacing:-.045em;margin-top:70px}
h1 em{font-style:normal;color:var(--coral)}
.sub{font-size:50px;line-height:1.28;font-weight:600;margin-top:44px}
.sub u{text-decoration-thickness:4px;text-underline-offset:10px}
.sub b{color:var(--yellow)}
.freq{display:flex;gap:18px;margin-top:64px}
.freq > div{flex:1;border-radius:36px;padding:34px 28px;color:var(--char)}
.freq > div:nth-child(1){background:var(--sky)}.freq > div:nth-child(2){background:var(--lav)}.freq > div:nth-child(3){background:var(--peach)}
.freq .x{font-size:28px;font-weight:600}
.freq .v{font-size:62px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.badge{margin-top:56px;align-self:flex-start;background:var(--yellow);color:var(--char);font-size:38px;font-weight:800;padding:22px 34px;border-radius:999px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.foot img{height:76px}
.foot span{font-size:40px;font-weight:700;color:var(--coral)}
.mala{position:absolute;right:110px;top:740px;width:170px;transform:rotate(10deg)}
.flor{position:absolute;right:70px;top:250px;width:90px}
.gota{position:absolute;left:-40px;bottom:520px;width:120px;opacity:.9}
</style></head><body>
<img class="mala" src="../assets/mala.png" alt="">
<img class="flor" src="../assets/formas/flor.png" alt="">
<div class="page">
  <div class="pills"><span class="pill white"><img src="../assets/icone.png" alt="">Ensino Bilin</span><span class="pill coral">Black Friday</span></div>
  <h1>1 semana<br>de aulas<br><em>grátis</em></h1>
  <p class="sub"><u>para quem fechar a matrícula</u><br>de <b>23/10 a 06/11</b>. Qualquer plano,<br>qualquer frequência.</p>
  <div class="freq">
    <div><div class="x">1x por semana</div><div class="v">1 aula</div></div>
    <div><div class="x">2x por semana</div><div class="v">2 aulas</div></div>
    <div><div class="x">3x por semana</div><div class="v">3 aulas</div></div>
  </div>
  <div class="badge">30/10 · Dia Bilin Black Friday</div>
  <div class="foot"><img src="../assets/logo-branco.png" alt="Bilin"><span>Link na bio →</span></div>
</div>
</body></html>
