<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Story semana grátis</title>
<style>
  *{box-sizing:border-box;margin:0}
  :root{--ink:#101713;--ink-3:#223027;--sage:#8c9468;--sage-2:#b7bf98;--coral:#f09a94;--gold:#f3cd6b;--cream:#f6f1e7}
  html,body{width:1080px;height:HPX;overflow:hidden}
  body{background:radial-gradient(900px 700px at 80% 8%,#2b3b2f 0%,transparent 65%),radial-gradient(700px 600px at 0% 100%,#26241a 0%,transparent 60%),var(--ink);color:var(--cream);font-family:"DM Sans",sans-serif;position:relative}
  .serif{font-family:Fraunces,Georgia,serif}
  .arc{position:absolute;border:4px dashed rgba(140,148,104,.5);border-radius:50%}
  .eyebrow{font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  .pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-weight:700}

</style></head><body>
<style>
  html,body{height:1920px}
  .arc.a1{width:1300px;height:1300px;left:-110px;top:-560px}
  .arc.a2{width:760px;height:760px;right:-300px;bottom:180px;border-color:rgba(240,154,148,.35)}
  .page{position:absolute;inset:0;padding:200px 90px 250px;display:flex;flex-direction:column}
  .logo{width:150px;align-self:center;margin-bottom:56px}
  .box{display:flex;flex-direction:column}
  .eyebrow{font-size:34px}
  h1{font-size:168px;line-height:.93;font-weight:900;margin-top:30px;letter-spacing:-.02em}
  h1 .c{color:var(--coral);display:block;font-size:204px}
  .sub{font-size:44px;line-height:1.28;margin-top:36px;color:#e6e0d3}
  .sub b{color:var(--gold)}
  .freq{display:flex;gap:18px;margin-top:44px}
  .freq > div{flex:1;background:var(--ink-3);border:2px solid #37483d;border-radius:28px;padding:26px 22px}
  .freq .x{font-size:30px;color:#bdb7a8}
  .freq .v{font-size:50px;font-weight:900;color:var(--coral);margin-top:6px;line-height:1.05}
  .badge{margin-top:40px;align-self:flex-start;background:var(--gold);color:var(--ink);font-size:38px;padding:22px 34px}
  .badge i{width:18px;height:18px;border-radius:50%;background:var(--ink)}
  .cta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:3px dashed rgba(140,148,104,.6);padding-top:40px;font-size:40px}
  .cta b{color:var(--coral)}
</style>
<div class="arc a1"></div><div class="arc a2"></div>
<div class="page"><img class="logo" src="../assets/logo-escuro.png" alt="Bilin">
<div class="box">
  <div class="eyebrow">Bilin Black Friday</div>
  <h1 class="serif">1 semana de aulas <span class="c">grátis</span></h1>
  <p class="sub">para quem fechar a matrícula de <b>23/10 a 06/11</b>. Qualquer plano, qualquer frequência.</p>
  <div class="freq">
    <div><div class="x">1x por semana</div><div class="v serif">1 aula</div></div>
    <div><div class="x">2x por semana</div><div class="v serif">2 aulas</div></div>
    <div><div class="x">3x por semana</div><div class="v serif">3 aulas</div></div>
  </div>
  <div class="pill badge"><i></i>30/10 · Dia Bilin Black Friday</div>
</div>
<div class="cta"><span>Garanta a sua vaga</span><b>Link na bio →</b></div>
</div>
</body></html>
